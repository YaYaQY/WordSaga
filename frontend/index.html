<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordSaga · AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Noto+Serif+SC:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="bg-glow bg-glow--left"></div>
  <div class="bg-glow bg-glow--right"></div>
  <div class="grain"></div>

  <header class="header">
    <div class="header__brand">
      <span class="header__mark">词境</span>
      <span class="header__title">WordSaga</span>
    </div>
    <div class="header__taglines">
      <p class="header__tagline header__tagline--en">Words grow in Saga</p>
      <p class="header__tagline header__tagline--zh">词汇于故事中沉淀</p>
    </div>
    <nav class="header__nav">
      <button type="button" class="nav-btn" data-view="home">开始学习</button>
      <button type="button" class="nav-btn" data-view="wrong">错题本</button>
    </nav>
  </header>

  <main id="app" class="app"></main>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
